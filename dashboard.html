        <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
          <label style="font-size:12px; color:#002060; font-weight:600;">Sector:</label>
          <select id="slicer_sector" style="font-size:12px; padding:3px 8px;
            border:1px solid #C9CED6; border-radius:5px; color:#2B2B2B; background:#fff;
            font-family:Segoe UI, Calibri, Arial, Helvetica, sans-serif;">
        <option value="PBI primario" selected>PBI primario</option>
        <option value="Agropecuario">Agropecuario</option>
        <option value="Comercio">Comercio</option>
        <option value="Construcción">Construcción</option>
        <option value="Electricidad y agua">Electricidad y agua</option>
        <option value="Hidrocarburos">Hidrocarburos</option>
        <option value="Manufactura no primaria">Manufactura no primaria</option>
        <option value="Manufactura primaria">Manufactura primaria</option>
        <option value="Minería metálica">Minería metálica</option>
        <option value="PBI no primario">PBI no primario</option>
        <option value="Pesca">Pesca</option>
        <option value="Producto Bruto Interno">Producto Bruto Interno</option>
        <option value="Servicios">Servicios</option>
          </select>
        </div>
        <div id="tabla_fen_wrap" style="overflow-x:auto;"></div>
        <figcaption>Fuente: BCRP (Reportes de Inflacion) y ENFEN. Elaboracion propia.
        "—" indica dato no disponible.</figcaption>
      </figure>
      <script>
      (function(){
        const DATA = {"PBI primario": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 5.3, 4.0, -1.6, 1.5], "pbi": [1.6, 3.1, 4.0, null, null], "diff": [null, 2.2, 0.0, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Agropecuario": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 2.2, 0.4, 0.3, -0.5], "pbi": [0.9, 3.0, -1.7, null, null], "diff": [null, -0.8, 2.1, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Comercio": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 2.9, 2.5, 4.5, 3.0], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Construcción": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, -0.7, 0.0, 10.0, 3.0], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Electricidad y agua": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 4.8, 4.3, 3.1, 2.9], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Hidrocarburos": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 6.3, 4.7, -6.2, 8.5], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Manufactura no primaria": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 1.8, 0.0, 3.3, 2.9], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Manufactura primaria": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 6.7, 0.0, -6.2, 8.5], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Minería metálica": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 4.5, 8.3, 0.3, 0.2], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "PBI no primario": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 2.0, 1.7, 4.7, 3.6], "pbi": [-0.7, 2.3, -1.4, null, null], "diff": [null, -0.3, 3.1, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Pesca": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 34.0, -15.0, -28.3, 8.5], "pbi": [65.9, 24.9, -3.5, null, null], "diff": [null, 9.1, -11.5, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Producto Bruto Interno": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 2.8, 2.2, 3.4, 3.2], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}, "Servicios": {"cols": [1998, 2017, 2023, 2026, 2027], "proy": [null, 3.3, 1.9, 4.5, 3.0], "pbi": [null, null, null, null, null], "diff": [null, null, null, null, null], "mag": ["Extraordinario", "Fuerte", "Fuerte", "Fuerte", "—"]}};
        const NAVY = "#002060";
        const TEAL = "#00AECB";

        function fmt(v){
          if(v===null||v===undefined) return '<span style="color:#9AA3AF">—</span>';
          const s = v.toFixed(1).replace(".",",");
          return (v>0?"+":"")+s+"%";
        }
        function diffColor(v){
          if(v===null||v===undefined) return "";
          if(v>1) return "color:#C00000";
          if(v<-1) return "color:#00B050";
          return "color:#686868";
        }
        function magColor(m){
          const map = {"Extraordinario":"#7B2D26","Fuerte":"#C00000",
                       "Moderada":"#ED7D31","Débil":"#FFC000","Neutra":"#9AA3AF"};
          return map[m] || "#9AA3AF";
        }

        function render(sector){
          const d = DATA[sector];
          if(!d) return;
          const hdr = [""].concat(d.cols.map(String));
          const rows = [
            ["Proyeccion BCRP"].concat(d.proy.map(fmt)),
            ["PBI %"].concat(d.pbi.map(fmt)),
            ["Diferencia"].concat(d.diff.map(function(v,i){
              return '<span style="'+diffColor(v)+'">'+fmt(v)+'</span>';
            })),
            ["Magnitud FEN"].concat(d.mag.map(function(m){
              if(m==="—") return '<span style="color:#9AA3AF">—</span>';
              return '<span style="color:'+magColor(m)+';font-weight:600">'+m+'</span>';
            }))
          ];
          let h = '<table style="width:100%;border-collapse:collapse;font-size:13px;font-family:Segoe UI, Calibri, Arial, Helvetica, sans-serif;">';
          h += '<tr>';
          hdr.forEach(function(c,i){
            const st = i===0
              ? 'text-align:left;padding:7px 10px;font-weight:700;color:'+NAVY+';border-bottom:2px solid '+TEAL
              : 'text-align:center;padding:7px 10px;font-weight:700;color:'+NAVY+';border-bottom:2px solid '+TEAL;
            h += '<th style="'+st+'">'+c+'</th>';
          });
          h += '</tr>';
          rows.forEach(function(row,ri){
            h += '<tr>';
            row.forEach(function(c,ci){
              const bg = ri%2===0 ? "#F8FBFD" : "#ffffff";
              const st = ci===0
                ? 'text-align:left;padding:6px 10px;font-weight:600;color:'+NAVY+';background:'+bg+';border-bottom:1px solid #E3F2ED'
                : 'text-align:center;padding:6px 10px;color:#2B2B2B;background:'+bg+';border-bottom:1px solid #E3F2ED';
              h += '<td style="'+st+'">'+c+'</td>';
            });
            h += '</tr>';
          });
          h += '</table>';
          document.getElementById("tabla_fen_wrap").innerHTML = h;
        }

        document.getElementById("slicer_sector").addEventListener("change", function(){
          render(this.value);
        });
        render("PBI primario");

        // Boton de descarga PNG usando html2canvas (inyecto el script si no existe).
        function addDownloadBtn(){
          if(document.getElementById("dl_tabla")) return;
          const card = document.getElementById("card_tabla_fen");
          const btn = document.createElement("button");
          btn.id = "dl_tabla";
          btn.textContent = "\u2B07 PNG";
          btn.title = "Descargar como imagen";
          btn.style.cssText = "position:absolute;top:10px;right:12px;font-size:11px;"+
            "padding:3px 9px;border:1px solid #C9CED6;border-radius:4px;background:#fff;"+
            "color:#002060;cursor:pointer;z-index:2;";
          card.style.position = "relative";
          card.appendChild(btn);
          btn.addEventListener("click", function(){
            if(typeof html2canvas==="undefined"){
              const sc = document.createElement("script");
              sc.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
              sc.onload = function(){ capture(); };
              document.head.appendChild(sc);
            } else { capture(); }
          });
          function capture(){
            btn.style.display = "none";
            html2canvas(card, {scale:3, backgroundColor:"#fff"}).then(function(canvas){
              btn.style.display = "";
              const a = document.createElement("a");
              a.download = "tabla_precision_fen.png";
              a.href = canvas.toDataURL("image/png");
              a.click();
            });
          }
        }
        addDownloadBtn();
      })();
      </script></main>
</body></html>
